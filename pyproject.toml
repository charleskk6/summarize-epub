[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summarize-epub"
version = "1.0.0"
description = "Structure-preserving Traditional Chinese EPUB summaries"
requires-python = ">=3.11"
dependencies = ["EbookLib>=0.19,<0.21", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "httpx>=0.27,<1", "python-dotenv>=1,<2", "rich>=13,<15", "opencc-python-reimplemented>=0.1.7,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
summarize-epub = "summarize_epub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
